<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sayko de poche</title>
<meta name="description" content="Parcours business, arabe, routine et heures de travail. Tout reste sur ton téléphone.">
<meta name="theme-color" content="#F5F6FA" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E16" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sayko">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preload" href="amiri-400.woff2" as="font" type="font/woff2" crossorigin>
<style>
@font-face{font-family:"Amiri";src:url("amiri-400.woff2") format("woff2");font-weight:400;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}
@font-face{font-family:"Amiri";src:url("amiri-700.woff2") format("woff2");font-weight:700;font-display:swap;unicode-range:U+0600-06FF,U+0750-077F,U+0870-088E,U+0890-0891,U+0897-08E1,U+08E3-08FF,U+200C-200E,U+2010-2011,U+204F,U+2E41,U+FB50-FDFF,U+FE70-FE74,U+FE76-FEFC}

:root{
  --bg:#F5F6FA; --surface:#FFFFFF; --sunk:#ECEEF4; --ink:#12162A; --ink-2:#3A3F55; --muted:#62687F; --line:#E1E4EC;
  --seg-on:#FFFFFF; --accent:#3148D4; --accent-ink:#FFFFFF; --accent-soft:#E7EAFB; --accent-2:#9AA7EC;
  --danger:#C0352B; --danger-soft:#FBE9E7; --warn:#A35F00; --warn-soft:#FBF0DC; --ok:#1D7A4B; --ok-soft:#E3F3EA;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --ar:"Amiri","Geeza Pro","Traditional Arabic","Noto Naskh Arabic",serif;
  --r:14px; --tab-h:58px;
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
  --ease:cubic-bezier(.2,.8,.2,1);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0C0E16; --surface:#161925; --sunk:#1D2130; --ink:#EDEFF7; --ink-2:#C9CDDC; --muted:#9398AE; --line:#272B3B;
    --seg-on:#343A52; --accent:#8E9DFF; --accent-ink:#0C0E16; --accent-soft:#1E2445; --accent-2:#4A568F;
    --danger:#FF8A7E; --danger-soft:#3A1C1A; --warn:#F2B35B; --warn-soft:#352812; --ok:#6FD3A0; --ok-soft:#14301F;
    color-scheme:dark;
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
[hidden]{display:none!important}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}

/* ---------- Structure ---------- */
main{max-width:560px;margin:0 auto;padding:calc(var(--sat) + 12px) 20px calc(var(--tab-h) + var(--sab) + 40px)}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;padding-top:8px}
.top h1{font:700 2.125rem/1.1 var(--display);letter-spacing:-.025em;margin:0;text-wrap:balance}
.top p{margin:6px 0 0;color:var(--muted);font-size:.95rem}
.top-actions{display:flex;gap:4px;margin-right:-10px}
.icon-btn{width:44px;height:44px;display:grid;place-items:center;border-radius:12px;color:var(--ink-2)}
.icon-btn:active{background:var(--sunk)}
.icon-btn svg{width:23px;height:23px}
section{margin-top:40px}
section:first-of-type{margin-top:28px}
h2{font:650 1.25rem/1.25 var(--display);letter-spacing:-.015em;margin:0 0 14px;text-wrap:balance}
h3{font:600 1rem/1.3 var(--sans);margin:0}
.eyebrow{font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}
.muted{color:var(--muted)}
.small{font-size:.875rem}
.hint{font-size:.8125rem;color:var(--muted);margin:8px 2px 0}
p{margin:0}
a{color:var(--accent)}

/* ---------- Boutons ---------- */
.btn{min-height:50px;padding:0 20px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s var(--ease),opacity .15s}
.btn:active{transform:scale(.97)}
.btn.block{width:100%}
.btn.quiet{background:var(--sunk);color:var(--ink)}
.btn.line{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--line)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn.sm{min-height:44px;padding:0 14px;font-size:.9375rem;border-radius:12px}
.row{display:flex;gap:10px;align-items:center}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}

/* ---------- Listes groupées (façon iOS) ---------- */
.group{background:var(--surface);border-radius:var(--r);overflow:hidden}
.cell{display:flex;align-items:center;gap:12px;min-height:52px;padding:10px 16px;position:relative}
.cell + .cell::before{content:"";position:absolute;top:0;left:16px;right:0;height:1px;background:var(--line)}
.cell label,.cell .lbl{flex:1;min-width:0}
.cell input[type=time],.cell input[type=date],.cell input[type=number],.cell input[type=text],.cell select{border:0;background:transparent;text-align:right;min-height:44px;font-variant-numeric:tabular-nums;color:var(--ink);max-width:62%}
.cell input[type=text]{text-align:left;max-width:none;width:100%}
.cell input:focus{outline:none}
.cell:focus-within{background:color-mix(in srgb,var(--accent-soft) 45%,transparent)}
.cell .val{font-variant-numeric:tabular-nums;color:var(--ink-2)}
.cell.tap{width:100%;text-align:left}
.cell.tap:active{background:var(--sunk)}
.chev{color:var(--muted);flex:none}

/* Segmented control */
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:3px;gap:3px}
.seg button{min-height:40px;border-radius:9px;font-weight:600;font-size:.9375rem;color:var(--ink-2);transition:background .2s var(--ease),color .2s}
.seg button[aria-pressed="true"]{background:var(--seg-on);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}

/* Stepper */
.stepper{display:flex;align-items:center;gap:2px}
.stepper button{width:44px;height:44px;border-radius:10px;font-size:1.3rem;color:var(--accent);display:grid;place-items:center}
.stepper button:active{background:var(--sunk)}
.stepper output{min-width:64px;text-align:center;font-variant-numeric:tabular-nums;font-weight:600}

/* Interrupteur */
.switch{position:relative;width:51px;height:31px;flex:none}
.switch input{position:absolute;inset:0;opacity:0;margin:0;cursor:pointer;z-index:1}
.switch span{position:absolute;inset:0;border-radius:99px;background:var(--line);transition:background .2s var(--ease)}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.2);transition:transform .25s var(--ease)}
.switch input:checked + span{background:var(--accent)}
.switch input:checked + span::after{transform:translateX(20px)}
.switch input:focus-visible + span{outline:2.5px solid var(--accent);outline-offset:2px}

/* Case à cocher */
.check{display:flex;gap:14px;align-items:flex-start;padding:12px 0;cursor:pointer;min-height:44px}
.check input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:24px;height:24px;border-radius:7px;box-shadow:inset 0 0 0 1.75px var(--muted);display:grid;place-items:center;margin-top:1px;transition:background .18s var(--ease),box-shadow .18s}
.box svg{width:15px;height:15px;stroke:var(--accent-ink);stroke-width:3;fill:none;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .25s var(--ease) .05s}
.check input:checked + .box{background:var(--accent);box-shadow:none;animation:pop .3s var(--ease)}
.check input:checked + .box svg{stroke-dashoffset:0}
.check input:focus-visible + .box{outline:2.5px solid var(--accent);outline-offset:2px}
.check .txt{flex:1;transition:color .2s}
.check input:checked ~ .txt{color:var(--muted)}
@keyframes pop{40%{transform:scale(1.15)}}
.checks{border-top:1px solid var(--line)}
.checks .check{border-bottom:1px solid var(--line)}

textarea{width:100%;min-height:110px;border:0;border-radius:var(--r);background:var(--surface);padding:14px 16px;resize:vertical;line-height:1.5}
textarea:focus{outline:2px solid var(--accent-2)}

/* Barres */
.bar{height:6px;border-radius:99px;background:var(--sunk);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--accent);transform-origin:left;transition:width .5s var(--ease)}

/* Pastilles */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:.75rem;font-weight:600;padding:3px 8px;border-radius:99px;background:var(--sunk);color:var(--ink-2);white-space:nowrap}
.pill.accent{background:var(--accent-soft);color:var(--accent)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.ok{background:var(--ok-soft);color:var(--ok)}

/* ---------- Parcours : la frise (élément signature) ---------- */
.frise-wrap{margin-top:26px}
.frise-head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:16px}
.big{font:700 3.25rem/1 var(--display);letter-spacing:-.04em;font-variant-numeric:tabular-nums}
.big small{font-size:1.25rem;letter-spacing:-.01em;margin-left:2px;color:var(--muted);font-weight:600}
.frise{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.quarter{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.quarter .ql{grid-column:1/-1;font-size:.6875rem;font-weight:600;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;margin-top:8px}
.mcol{position:relative;height:132px;border-radius:9px;background:var(--sunk);overflow:hidden;display:block;width:100%}
.mcol .fill{position:absolute;inset:0;background:var(--accent);transform-origin:bottom;transform:scaleY(0);transition:transform .7s var(--ease)}
.mcol .n{position:absolute;left:0;right:0;bottom:6px;text-align:center;font-size:.75rem;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);transition:color .3s}
.mcol.lit .n{color:var(--accent-ink)}
.mcol.now{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--accent)}
.mcol.now::before{content:"";position:absolute;top:8px;left:50%;width:6px;height:6px;margin-left:-3px;border-radius:50%;background:var(--accent);z-index:1}
.mcol.now.lit::before{background:var(--accent-ink)}
.mcol:active{transform:scale(.96)}
.mcol{transition:transform .15s var(--ease)}

.focus-month{margin-top:36px}
.focus-month .why{font-size:1.0625rem;color:var(--ink-2);margin-top:8px}
.res{list-style:none;padding:0;margin:0}
.res li{padding:12px 0;border-bottom:1px solid var(--line)}
.res li:first-child{border-top:1px solid var(--line)}
.res li b{font-weight:600;display:block}
.res li span{font-size:.875rem;color:var(--muted)}
.exercise{margin-top:22px;padding:16px 18px;border-radius:var(--r);background:var(--accent-soft)}
.exercise .eyebrow{color:var(--accent)}
.exercise p{margin-top:6px}
.sub-h{margin:26px 0 6px;display:flex;justify-content:space-between;align-items:baseline}

.skills{display:grid;gap:14px}
.skill{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.skill .bar{grid-column:1/-1}

.months details{border-bottom:1px solid var(--line)}
.months details:first-of-type{border-top:1px solid var(--line)}
.months summary{list-style:none;display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;min-height:60px;padding:8px 0;cursor:pointer}
.months summary::-webkit-details-marker{display:none}
.months .mn{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:.875rem;background:var(--sunk);color:var(--ink-2);font-variant-numeric:tabular-nums}
.months details.done .mn{background:var(--accent);color:var(--accent-ink)}
.months .mt small{display:block;font-size:.8125rem;color:var(--muted)}
.months .mbody{padding:4px 0 22px}
.qhead{margin:26px 0 4px}

/* ---------- Arabe ---------- */
.ar{font-family:var(--ar);direction:rtl;unicode-bidi:isolate}
.quiz{background:var(--surface);border-radius:20px;padding:22px 18px 18px;text-align:center}
.quiz .word{font-family:var(--ar);font-size:3.6rem;line-height:1.7;direction:rtl}
.quiz .root{font-size:.875rem;color:var(--muted);min-height:1.5em}
.quiz .root .ar{font-size:1.2rem}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.opt{min-height:56px;padding:8px 10px;border-radius:12px;background:var(--sunk);font-weight:500;line-height:1.25;transition:background .2s,color .2s,transform .15s var(--ease)}
.opt:active{transform:scale(.97)}
.opt.good{background:var(--ok);color:var(--surface)}
.opt.bad{background:var(--danger);color:var(--surface)}
.opt.dim{opacity:.45}
.quiz-foot{display:flex;justify-content:space-between;align-items:center;margin-top:14px;font-size:.8125rem;color:var(--muted);min-height:44px}
.mastery{display:flex;gap:3px;justify-content:center}
.mastery i{width:18px;height:4px;border-radius:2px;background:var(--sunk)}
.mastery i.on{background:var(--ok)}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}

.verse{padding:14px 0;border-bottom:1px solid var(--line)}
.verse:first-child{border-top:1px solid var(--line)}
.verse .vn{font-size:.75rem;color:var(--muted);font-weight:600}
.words{display:flex;flex-wrap:wrap;gap:6px 8px;direction:rtl;margin-top:6px}
.w{display:flex;flex-direction:column;align-items:center;min-width:48px;min-height:44px;padding:2px 6px;border-radius:10px;transition:background .2s}
.w:active{background:var(--sunk)}
.w .a{font-family:var(--ar);font-size:1.75rem;line-height:1.75}
.w .f{font-size:.75rem;color:var(--muted);direction:ltr;max-width:9em;text-align:center;line-height:1.25;transition:opacity .25s,filter .25s}
.hide .w:not(.shown) .f{opacity:0;filter:blur(3px)}
.hide .w:not(.shown) .a{color:var(--ink)}
.hide .w.shown .f{color:var(--accent)}

.counter{display:flex;align-items:center;justify-content:space-between;gap:10px}
.counter .big{font-size:2.75rem}
.sour{display:grid;grid-template-columns:1fr;border-top:1px solid var(--line)}
.sour .check{border-bottom:1px solid var(--line);align-items:center}
.sour .sn{font-variant-numeric:tabular-nums;color:var(--muted);font-size:.8125rem;width:28px}
.sour .ar{font-size:1.35rem;line-height:1.3}
.cur-q{background:var(--accent-soft);border-radius:var(--r);padding:4px 16px 8px}
.cur-q .checks{border-top:0}
.cur-q .checks .check:last-child{border-bottom:0}

/* ---------- Routine ---------- */
.routine-hero{display:flex;align-items:center;gap:20px;margin-top:26px}
.done-btn{flex:none;width:120px;height:120px;border-radius:50%;background:var(--sunk);color:var(--ink);display:grid;place-items:center;text-align:center;font-weight:600;font-size:.9375rem;line-height:1.25;padding:14px;transition:background .3s var(--ease),color .3s,transform .15s var(--ease)}
.done-btn:active{transform:scale(.95)}
.done-btn.on{background:var(--accent);color:var(--accent-ink)}
.done-btn svg{width:30px;height:30px;display:block;margin:0 auto 4px}
.split{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:3px;margin:16px 0 4px}
.split i{display:block;background:var(--accent)}
.split i:nth-child(2){opacity:.75}.split i:nth-child(3){opacity:.5}.split i:nth-child(4){opacity:.3}
.slots{display:grid}
.slot{display:grid;grid-template-columns:62px 1fr;gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.slot b{font-variant-numeric:tabular-nums;font-weight:700}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{text-align:center;font-size:.75rem;color:var(--muted);font-weight:600}
.day{aspect-ratio:1;border-radius:10px;background:var(--sunk);display:grid;place-items:center;font-size:.8125rem;font-variant-numeric:tabular-nums;color:var(--muted);min-height:40px;transition:background .2s,color .2s}
.day.on{background:var(--accent);color:var(--accent-ink);font-weight:700}
.day.today{box-shadow:inset 0 0 0 2px var(--accent)}
.day.on.today{box-shadow:inset 0 0 0 2px var(--accent-ink)}
.day:disabled{opacity:.35;cursor:default}

/* ---------- Heures ---------- */
.week-hero{margin-top:26px}
.week-hero .big{font-size:3rem}
.emp-rows{display:grid;gap:14px;margin-top:18px}
.emp-row{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:baseline}
.emp-row .bar{grid-column:1/-1;position:relative;overflow:visible;background:var(--sunk)}
.emp-row .bar i{max-width:100%}
.emp-row .bar.over i{background:var(--warn)}
.alert{display:flex;gap:10px;align-items:flex-start;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.9rem}
.alert.danger{background:var(--danger-soft);color:var(--danger)}
.alert svg{flex:none;width:20px;height:20px;margin-top:1px}
.preview{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 4px 0;font-size:.9375rem}
.preview b{font-size:1.25rem;font-variant-numeric:tabular-nums;white-space:nowrap;flex:none}
.form-actions{display:grid;grid-template-columns:1fr auto;gap:10px;margin-top:14px}
.flash{animation:flash .9s var(--ease)}
@keyframes flash{0%{box-shadow:0 0 0 3px var(--accent)}100%{box-shadow:0 0 0 3px transparent}}

.month-nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.month-nav h2{margin:0;text-transform:capitalize}
.month-nav .row{gap:0}
.emp-block{padding:16px 0;border-bottom:1px solid var(--line)}
.emp-block:first-of-type{border-top:1px solid var(--line)}
.emp-block .head{display:flex;justify-content:space-between;align-items:baseline}
.emp-block .head b{font-size:1.5rem;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.kv div{font-size:.8125rem;color:var(--muted)}
.kv div b{display:block;font-size:.9375rem;color:var(--ink);font-variant-numeric:tabular-nums;font-weight:600}
.payslip{display:flex;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap}
.payslip label{font-size:.875rem;color:var(--ink-2)}
.payslip input{width:96px;min-height:44px;border:0;border-radius:10px;background:var(--surface);padding:0 10px;text-align:right;font-variant-numeric:tabular-nums}
.payslip input:focus{outline:2px solid var(--accent-2)}
.weeks .wk{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.weeks .wk:first-child{border-top:1px solid var(--line)}
.weeks .wk small{grid-column:1/-1;color:var(--muted);font-size:.8125rem}
.shift{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;width:100%;text-align:left;padding:12px 0;border-bottom:1px solid var(--line);min-height:60px}
.shift:active{background:var(--sunk)}
.shift .d{text-align:center;line-height:1.1}
.shift .d b{display:block;font-size:1.25rem;font-variant-numeric:tabular-nums}
.shift .d span{font-size:.6875rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.shift .who{font-weight:600}
.shift .when{font-size:.8125rem;color:var(--muted);font-variant-numeric:tabular-nums}
.shift .tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.shift .dur{font-weight:600;font-variant-numeric:tabular-nums}
.filters{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap}
.chip{min-height:36px;padding:0 14px;border-radius:99px;background:var(--sunk);font-size:.875rem;font-weight:600;color:var(--ink-2)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.empty{padding:24px 0;color:var(--muted);text-align:center;font-size:.9375rem}
.backup-nudge{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-top:22px;padding:12px 14px;border-radius:12px;background:var(--surface);font-size:.875rem}

/* ---------- Barre d'onglets ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding-bottom:var(--sab);background:color-mix(in srgb,var(--bg) 82%,transparent);-webkit-backdrop-filter:saturate(180%) blur(20px);backdrop-filter:saturate(180%) blur(20px);border-top:1px solid var(--line)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tabbar button{height:var(--tab-h);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.6875rem;font-weight:600;color:var(--muted);transition:color .2s}
.tabbar svg{width:25px;height:25px}
.tabbar button[aria-selected="true"]{color:var(--accent)}
.tabbar button:active svg{transform:scale(.9)}
.tabbar svg{transition:transform .15s var(--ease)}

/* ---------- Feuilles (dialog) ---------- */
dialog.sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:560px;max-height:92vh;max-height:92dvh;border-radius:20px 20px 0 0;background:var(--bg);color:var(--ink);overflow:auto;overscroll-behavior:contain}
dialog.sheet::backdrop{background:rgba(8,10,20,.45)}
dialog.sheet[open]{animation:up .32s var(--ease)}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet-in{padding:10px 20px calc(var(--sab) + 24px)}
.grab{width:38px;height:5px;border-radius:3px;background:var(--line);margin:0 auto 10px}
.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;min-height:44px}
.sheet-top h2{margin:0}
.link-btn{min-height:44px;padding:0 6px;color:var(--accent);font-weight:600}
.sheet .group + .group,.sheet .group + .hint + .group{margin-top:22px}
.sheet .gt{font-size:.8125rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600;margin:26px 4px 8px}
.idea{display:flex;gap:10px;align-items:flex-start;padding:12px 0;border-bottom:1px solid var(--line)}
.idea p{flex:1;white-space:pre-wrap;word-break:break-word}
.idea time{display:block;font-size:.75rem;color:var(--muted);margin-top:2px}
.confirm{margin-top:14px;padding:14px;border-radius:12px;background:var(--surface)}

/* Toast */
.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + var(--sab) + 14px);transform:translate(-50%,20px);opacity:0;z-index:40;background:var(--ink);color:var(--bg);border-radius:14px;padding:6px 6px 6px 16px;display:flex;align-items:center;gap:10px;font-size:.9375rem;max-width:calc(100% - 32px);box-shadow:0 8px 30px rgba(0,0,0,.2);transition:transform .3s var(--ease),opacity .3s;pointer-events:none}
.toast.on{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.toast button{min-height:40px;padding:0 12px;border-radius:10px;color:var(--accent-2);font-weight:700}
.toast .msg{padding:8px 0}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>
<main id="app" tabindex="-1"></main>

<nav class="tabbar" aria-label="Sections">
  <div class="in" role="tablist">
    <button role="tab" data-tab="parcours" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V14M9 20V10M14 20V7M19 20V4"/></svg>Parcours</button>
    <button role="tab" data-tab="arabe" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6.5C10 5 7 4.5 3.5 5v13c3.5-.5 6.5 0 8.5 1.5 2-1.5 5-2 8.5-1.5V5C17 4.5 14 5 12 6.5z"/><path d="M12 6.5v13"/></svg>Arabe</button>
    <button role="tab" data-tab="routine" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 12a8 8 0 1 1-4.7-7.3"/><path d="M8.5 11.5l3 3L20 6"/></svg>Routine</button>
    <button role="tab" data-tab="heures" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>Heures</button>
  </div>
</nav>

<!-- Feuille : édition d'un service -->
<dialog class="sheet" id="shiftSheet" aria-labelledby="shiftSheetTitle"><div class="sheet-in" id="shiftSheetBody"></div></dialog>
<!-- Feuille : réglages & sauvegarde -->
<dialog class="sheet" id="settingsSheet" aria-labelledby="settingsTitle"><div class="sheet-in" id="settingsBody"></div></dialog>
<!-- Feuille : idées -->
<dialog class="sheet" id="ideasSheet" aria-labelledby="ideasTitle"><div class="sheet-in" id="ideasBody"></div></dialog>

<input type="file" id="importFile" accept=".json,application/json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite"><span class="msg"></span><button type="button" hidden></button></div>

<script src="app.js"></script>
</body>
</html>
