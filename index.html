.w-item.wp>svg{width:62px;height:62px;overflow:visible;filter:drop-shadow(0 6px 14px rgba(0,0,0,.5))}

.w-item.wp.hi>svg{transform:scale(1.18);transition:transform .15s var(--ease)}
.w-item.wp.locked{background:transparent;opacity:.7}
.core.bhole{background:transparent!important;box-shadow:none!important;overflow:visible}
.core.bhole>svg{display:none}
.bh{position:absolute;inset:0;pointer-events:none}
.bh i{position:absolute;display:block;border-radius:50%}
.bh-glow{inset:-16px;background:radial-gradient(circle,rgba(255,196,120,.45) 0%,rgba(242,140,60,.18) 42%,rgba(242,140,60,0) 70%);animation:bhpulse 4.5s ease-in-out infinite}
@keyframes bhpulse{50%{transform:scale(1.08);opacity:.8}}
.bh-lens{inset:5px;background:conic-gradient(from 0deg,#FFF1CF,#F6B45E,#9A3E12,#F6B45E,#FFE2A0,#C9661E,#FFF1CF);-webkit-mask:radial-gradient(circle,transparent 52%,#000 55%,#000 66%,transparent 72%);mask:radial-gradient(circle,transparent 52%,#000 55%,#000 66%,transparent 72%);animation:spin 5s linear infinite;filter:blur(.4px)}
.bh-disk{left:-14px;right:-14px;top:50%;height:88px;margin-top:-44px;transform:scaleY(.26) rotate(-8deg)}
.bh-disk b{position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#FFF6DC,#FFB866,#C2541A,#5A1E08,#C2541A,#FFB866,#FFF6DC);-webkit-mask:radial-gradient(circle,transparent 30%,#000 34%,#000 62%,transparent 71%);mask:radial-gradient(circle,transparent 30%,#000 34%,#000 62%,transparent 71%);animation:spin 3.2s linear infinite}
.bh-disk.back{clip-path:inset(0 0 50% 0)}
.bh-disk.front{clip-path:inset(50% 0 0 0)}
.bh-core{inset:19px;background:radial-gradient(circle at 50% 50%,#000 62%,#0B0604 100%);box-shadow:0 0 0 1.3px rgba(255,236,196,.95),0 0 10px 2px rgba(255,190,110,.65)}
@media (prefers-reduced-motion: reduce){.bh-glow,.bh-lens,.bh-disk b{animation:none}}

/* ---------- Constellation réaliste ---------- */
.constel{margin:4px -20px 0}.constel>svg{max-height:320px;overflow:visible}
.star{cursor:pointer}
.star.tw{animation:stw 3.6s ease-in-out infinite}
@keyframes stw{0%,100%{opacity:1}45%{opacity:.72}55%{opacity:.95}}
.constel-tip{color:var(--ink-2)}
/* ---------- Ouverture sur tout l'écran : la galaxie derrière ---------- */
.intro{background:radial-gradient(ellipse 120% 90% at 50% 46%,rgba(2,4,7,.05) 0%,rgba(2,4,7,.55) 70%,rgba(2,4,7,.85) 100%)!important}
.intro::before{content:"";position:absolute;inset:0;background:#020407;animation:introReveal 1.3s ease .35s forwards;pointer-events:none}
@keyframes introReveal{to{opacity:0}}
.intro .intro-wrap{position:relative;z-index:1}
body:has(#intro) #app,body:has(#intro) .core{opacity:0}
#app,.core{transition:opacity .6s var(--ease)}
@media (prefers-reduced-motion: reduce){.star.tw{animation:none}}

/* ---------- Anneaux, questionnaires (chasse) ---------- */
.zhero{display:flex;align-items:center;gap:20px;margin-top:18px}
.zring{position:relative;width:132px;height:132px;flex:none}.zring svg{width:100%;height:100%}
.zring>div{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.zring b{font:400 2.2rem/1 var(--serif)}.zring b small{font-size:1rem;color:var(--muted)}.zring span{font-size:.75rem;color:var(--muted);margin-top:4px;max-width:90px}
.zside{flex:1;min-width:0}
.cbar{height:6px;border-radius:3px;background:var(--raise);overflow:hidden;margin-top:14px}.cbar i{display:block;height:100%;background:linear-gradient(90deg,#E8C27A,#C48F3A);border-radius:3px}
.cbar.sm{display:block;height:3px;margin-top:6px;max-width:170px}
.cq{margin-top:16px;padding:18px 16px;border-radius:var(--r);background:color-mix(in srgb,var(--surface) 82%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 24%,transparent)}
.copt{display:flex;align-items:center;gap:12px;width:100%;margin-top:8px;padding:12px 14px;border-radius:14px;background:var(--raise);text-align:left;font-weight:550;min-height:52px}
.copt b{flex:none;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:color-mix(in srgb,var(--gold) 18%,transparent);color:var(--gold);font-size:.8125rem}
.copt.ok{box-shadow:inset 0 0 0 2px var(--mint);background:color-mix(in srgb,var(--mint) 14%,var(--raise))}.copt.ok b{background:var(--mint);color:#06231C}
.copt.ko{box-shadow:inset 0 0 0 2px var(--danger);background:color-mix(in srgb,var(--danger) 12%,var(--raise))}.copt.ko b{background:var(--danger);color:#fff}
.copt:disabled{opacity:1}
.cexp{margin:14px 0 0;padding:12px 14px;border-radius:14px;background:var(--gold-soft);line-height:1.5}
.cth .lbl{display:flex;flex-direction:column}
.chbars{display:grid;grid-template-columns:repeat(8,1fr);gap:6px;height:90px;margin-top:14px;align-items:end}
.chbars div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.chbars i{width:100%;min-height:3px;border-radius:6px 6px 2px 2px;background:var(--gold);opacity:.6}.chbars i.ok{background:var(--mint);opacity:.9}
.chbars span{font-size:.6875rem;color:var(--muted)}
.bzform{display:grid;gap:8px}.bzform input,.bzform select{min-height:44px;border:0;border-radius:12px;background:var(--raise);padding:0 12px;color:var(--ink);font:inherit;width:100%}
/* ---------- Adhkar après la prière ---------- */
.adk{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,7,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}

.adk-in{width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:20px 20px calc(var(--sab) + 22px);border-radius:28px 28px 0 0;background:color-mix(in srgb,var(--surface) 92%,transparent);box-shadow:inset 0 1px 0 rgba(232,194,122,.35);transform:translateY(30px);transition:transform .35s var(--ease)}
.adk.on .adk-in{transform:none}
.adk-dots{display:flex;gap:4px;margin:12px 0 4px}.adk-dots i{flex:1;height:3px;border-radius:2px;background:var(--raise)}.adk-dots i.ok{background:var(--gold);opacity:.6}.adk-dots i.cur{background:var(--gold)}
.adk-t{margin:14px 0 0;text-align:center;color:var(--muted);font-size:.8125rem;letter-spacing:.06em;text-transform:uppercase}
.adk-bism{margin:10px 0 0;text-align:center;font:400 1.15rem/1.6 'Amiri',serif;color:var(--gold)}
.adk-ar{margin:12px 0 4px;text-align:center;font:400 1.9rem/1.9 'Amiri',serif;color:var(--ink)}
.adk-ar.long{font-size:1.35rem;line-height:2.05}
.adk-tap{display:block;position:relative;width:170px;height:170px;margin:10px auto 0;border-radius:50%;-webkit-tap-highlight-color:transparent}
.adk-tap svg{position:absolute;inset:0;width:100%;height:100%}
.adk-tap span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.adk-tap b{font:400 3rem/1 var(--serif);color:var(--gold)}.adk-tap small{font-size:.75rem;color:var(--muted);margin-top:4px;max-width:110px;text-align:center}
.adk-tap:active{transform:scale(.96)}
.adk-end{text-align:center}.adk-big{font:400 2.6rem/1.5 'Amiri',serif;color:var(--gold);margin:20px 0 0}
.adk-chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:99px;background:var(--gold-soft);color:var(--gold);font-weight:650;font-size:.8125rem}
/* ---------- Qibla ---------- */
.qstage{margin:12px -10px 0}.qstage svg{display:block;width:100%;max-height:440px}
#qsky{transition:transform .15s linear}
.qcard{font:600 13px var(--sans,system-ui);fill:#F3D9A4;letter-spacing:.06em}

.qstage.lock .qkaaba{animation:qflare 1.2s ease-in-out infinite}
@keyframes qflare{50%{opacity:.75}}
.qstage.lock svg{filter:drop-shadow(0 0 22px rgba(232,194,122,.45))}
.qstate{text-align:center;margin:6px 0 0;font-size:1.05rem}
/* ---------- Trophées ---------- */
.trsheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,4,7,.55);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.trsheet.on{opacity:1;pointer-events:auto}
.tr-in{width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:20px 20px calc(var(--sab) + 22px);border-radius:28px 28px 0 0;background:color-mix(in srgb,var(--surface) 94%,transparent);box-shadow:inset 0 1px 0 rgba(232,194,122,.35)}
.trgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tr{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:16px 10px;border-radius:20px;background:var(--raise);box-shadow:inset 0 0 0 1px rgba(232,194,122,.22)}
.tr b{font-size:.9375rem}.tr small{font-size:.75rem;color:var(--muted)}.tr p{margin:4px 0 0;font-size:.75rem;color:var(--ink-2)}
.trmed{display:grid;place-items:center;width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#FFF4D6,#E8C27A 45%,#9A6B2C);box-shadow:inset 0 -4px 10px rgba(0,0,0,.35),0 10px 24px -10px rgba(232,194,122,.8);font-size:30px;margin-bottom:6px}
.trmed.dim{filter:grayscale(.8);opacity:.5}
.trempty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 0}

/* ---------- Foi : six onglets ---------- */
.fseg{display:flex;gap:6px;margin:20px -20px 0;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.fseg::-webkit-scrollbar{display:none}
.fseg button{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:0 14px;border-radius:99px;background:color-mix(in srgb,var(--surface) 80%,transparent);color:var(--ink-2);font-weight:600;font-size:.875rem;box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 14%,transparent)}
.fseg button.on{background:var(--seg-on);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--gold)}
.fseg button.lock{color:var(--muted)}.fseg button svg{width:14px;height:14px;color:var(--gold)}
.lockv{text-align:center;padding:26px 18px;margin-top:18px;border-radius:var(--r);background:color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 20%,transparent)}
.lockic{display:inline-grid;place-items:center;width:58px;height:58px;border-radius:50%;background:var(--gold-soft);color:var(--gold)}.lockic svg{width:26px;height:26px}
.lockv .cbar{max-width:260px;margin:14px auto 0}
.zdays{display:grid;grid-template-columns:repeat(14,1fr);gap:4px;margin-top:14px}
.zdays i{display:block;height:8px;border-radius:4px;background:var(--raise)}.zdays i.half{background:color-mix(in srgb,var(--mint) 45%,var(--raise))}.zdays i.on{background:var(--mint)}.zdays i.today{box-shadow:0 0 0 1.5px var(--gold)}
/* ---------- Chemin de l'arabe ---------- */
.arpath{display:flex;gap:8px;margin:14px -20px 0;padding:0 20px 4px;overflow-x:auto;scrollbar-width:none}
.arpath::-webkit-scrollbar{display:none}
.arstep{flex:none;width:92px;display:flex;flex-direction:column;align-items:center;gap:3px;padding:10px 6px;border-radius:16px;background:color-mix(in srgb,var(--surface) 80%,transparent);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 14%,transparent);text-align:center}
.arstep i{display:grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--raise);font-style:normal;font-weight:700;color:var(--ink-2)}.arstep i svg{width:14px;height:14px;color:var(--gold)}
.arstep b{font-size:.75rem;line-height:1.2}.arstep small{font-size:.6875rem;color:var(--muted)}
.arstep.ok i{background:linear-gradient(135deg,#F8E9C4,#E8C27A 50%,#C48F3A);color:#1E1406}
.arstep.cur{box-shadow:inset 0 0 0 1.5px var(--gold)}.arstep.lock{opacity:.6}
.arverse{margin-top:12px;padding:12px;border-radius:16px;background:color-mix(in srgb,var(--surface) 80%,transparent)}

.arwords{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.arw{display:flex;flex-direction:column;align-items:center;padding:6px 10px;border-radius:12px;background:var(--raise);font:400 1.35rem/1.5 'Amiri',serif;color:var(--ink)}
.arw small{display:none;font:600 .6875rem/1.2 system-ui,sans-serif;color:var(--gold);direction:ltr;max-width:120px;text-align:center}
.arw.show{box-shadow:inset 0 0 0 1px var(--gold)}.arw.show small{display:block}
.arbig{margin:14px 0 6px;text-align:center;font:400 2.2rem/1.7 'Amiri',serif;color:var(--ink)}
.arread{margin:14px 0;font:400 1.6rem/2.1 'Amiri',serif;text-align:center;color:var(--ink)}
.pstar{animation:pstar 4s ease-in-out infinite}@keyframes pstar{50%{opacity:.8}}
.nova circle,.nova path{transform-origin:0 0;transform:scale(.1);opacity:0}
.nova.go circle,.nova.go path{animation:nova 1.2s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes nova{30%{opacity:1;transform:scale(1.4)}100%{opacity:0;transform:scale(3)}}
/* ---------- Surérogatoires et Coran ---------- */
.nafb{padding:4px 16px 14px}

.hzk{align-self:flex-start;min-height:34px;padding:0 12px;border-radius:99px;background:var(--raise);font-size:.75rem;font-weight:650;color:var(--ink-2)}

/* ---------- Lunes ---------- */
.moon{animation:spin 12s linear infinite}
@media (prefers-reduced-motion: reduce){.moon,.pstar{animation:none}}

/* ---------- Qibla : fenêtre sur le ciel ---------- */
.qsky{position:relative;height:min(62vh,520px);margin:14px -20px 0;overflow:hidden;touch-action:pan-y;-webkit-mask:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%);mask:linear-gradient(180deg,transparent 0,#000 7%,#000 93%,transparent 100%)}

/* ---------- Trophées : la vitrine ---------- */
.trsheet{position:fixed;inset:0;z-index:60;display:flex;align-items:flex-end;justify-content:center;background:rgba(2,3,5,.7);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}

.trcer{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;background:radial-gradient(60% 50% at 50% 42%,#2A1E14,#050403 75%);opacity:0;pointer-events:none;transition:opacity .4s;text-align:center;padding:24px}

}

/* =====================================================================
   L'ARC DU COMBATTANT — encre noire, rouge profond, or. Univers à part.
   ===================================================================== */
body.arc-on{
  --bg:#09090B;--bg-2:#111114;--surface:#141417;--raise:#1D1D22;--ink:#F2EEE5;--ink-2:#CFC9BD;--muted:#8E8A82;--line:#2A2A30;--orbit:#3A3A42;
  --gold:#E2B553;--gold-hi:#F0C870;--gold-ink:#0A0A0C;--gold-soft:rgba(226,181,83,.14);--glow:rgba(215,38,61,.25);
  --mint:#E2B553;--mint-soft:rgba(226,181,83,.14);--seg-bg:#17171B;--seg-on:#26262C;--danger:#D7263D;--danger-soft:rgba(215,38,61,.15);
  --arc-red:#D7263D;--arc-gold:#E2B553;--arc-ok:#7FD6A6;--arc-paper:#F2EEE5;
  --brush:"Avenir Next Condensed","Arial Narrow","Roboto Condensed","Helvetica Neue",Impact,sans-serif;

.sysfab svg{background:radial-gradient(circle,rgba(6,16,38,.95),rgba(3,8,22,.98))}

/* v3.21 — moins de texte : l'aide passe dans le bouton (i), les explications secondaires disparaissent */
body.sys-on main .hint,body.sys-on main .coach{display:none!important}
body.sys-on .arc-story>p,body.sys-on .rt-d,body.sys-on .why{display:none}
body.sys-on .sys-ol{margin:8px 0 0;padding-left:18px;color:#E6F1FF;font-size:.9rem;line-height:1.5}
body.sys-on .top p{font-size:.85rem;margin-top:2px}
body.sys-on .sys-d small{font-size:.68rem}
body.sys-on .pq-h small{font-size:.62rem}

/* v3.22 — entrées avec son : écran d'attente du toucher */
.intro.sys-i.wait,.intro.sys-i.wait *{animation-play-state:paused!important}
.sb-gate{position:absolute;left:0;right:0;bottom:calc(var(--sab) + 70px);margin:0;text-align:center;font:700 .74rem -apple-system,system-ui,sans-serif;letter-spacing:.3em;color:#9AD8FF;text-shadow:0 0 10px #4DB0FF;animation:sbBlink 1.4s ease-in-out infinite!important}
.intro.sys-i:not(.wait) .sb-gate{display:none}
@keyframes sbBlink{50%{opacity:.25}}
.aw-gate{position:absolute;inset:0;display:grid;place-content:center;gap:14px;text-align:center;background:#000;z-index:3;font-family:-apple-system,system-ui,sans-serif}
.aw-gate p{margin:0;font-size:.9rem;letter-spacing:.12em;color:#6C7A8C}
.aw-gate b{font-size:.74rem;letter-spacing:.32em;color:#C9D6E6;animation:sbBlink 1.6s ease-in-out infinite}
.intro.sys-i.wait .sb-gate{animation-play-state:running!important}
/* Alerte d'inactivité */
.inact{position:fixed;inset:0;z-index:500;display:grid;place-items:center;padding:20px;background:#000;opacity:0;transition:opacity .35s;font-family:-apple-system,system-ui,sans-serif;overflow:hidden}
.inact.on{opacity:1}
.in-vig{position:absolute;inset:-10%;background:radial-gradient(circle at 50% 50%,transparent 30%,rgba(160,0,25,.55) 75%,rgba(60,0,10,.95));animation:inPulse 1.1s ease-in-out infinite}
@keyframes inPulse{50%{opacity:.45}}
.in-scan{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(255,0,40,.06) 0 2px,transparent 2px 4px);animation:inScan 6s linear infinite;pointer-events:none}
@keyframes inScan{to{background-position:0 400px}}
.in-box{position:relative;width:min(360px,100%);padding:26px 22px 22px;text-align:center;border:1px solid rgba(255,60,85,.9);background:rgba(20,0,5,.82);box-shadow:0 0 24px rgba(255,30,60,.6),0 0 80px rgba(255,0,40,.3),inset 0 0 30px rgba(255,30,60,.2);animation:inShake 4s infinite}
@keyframes inShake{0%,92%,100%{transform:none}93%{transform:translate(-4px,1px)}94%{transform:translate(3px,-2px)}95%{transform:translate(-2px,2px)}96%{transform:none}}
.in-warn{margin:0;font-weight:800;font-size:.8rem;letter-spacing:.34em;color:#FF4D6A;text-shadow:0 0 10px #FF0030;animation:sbBlink .9s steps(2) infinite}
.in-t{position:relative;margin:14px 0 6px;font-weight:900;font-size:1.55rem;letter-spacing:.08em;color:#fff;text-shadow:0 0 14px #FF2040,0 0 30px #FF0030}
.in-t::before,.in-t::after{content:attr(data-g);position:absolute;inset:0;opacity:.7}
.in-t::before{color:#0ff;transform:translate(2px,0);clip-path:inset(0 0 60% 0);animation:inGl 2.2s infinite steps(1)}
.in-t::after{color:#f03;transform:translate(-2px,0);clip-path:inset(55% 0 0 0);animation:inGl 1.7s infinite steps(1) reverse}
@keyframes inGl{0%,80%{transform:none;opacity:0}82%{transform:translate(3px,-1px);opacity:.8}86%{transform:translate(-3px,1px)}90%{opacity:0}}
.in-n{margin:4px 0;font-weight:900;font-size:4.4rem;line-height:1;color:#FF4D6A;text-shadow:0 0 24px rgba(255,0,40,.9)}.in-n small{font-size:1rem;letter-spacing:.2em}
.in-l{margin:6px 0 0;font-size:.9rem;color:#FFD0D8}.in-l.dim{margin-top:14px;font-size:.8rem;color:#C98A96;line-height:1.45}
.in-loss{display:grid;gap:6px;margin:16px 0 0;padding:12px 14px;border:1px solid rgba(255,60,85,.4);background:rgba(255,0,40,.07)}
.in-loss p{display:flex;justify-content:space-between;margin:0;font-weight:700;letter-spacing:.14em;font-size:.78rem;color:#FFB3C0}.in-loss b{font-size:1rem;color:#FF4D6A;letter-spacing:0}
.in-hold{position:relative;width:100%;min-height:54px;margin-top:20px;overflow:hidden;border:1px solid #FF4D6A;background:rgba(255,0,40,.1);color:#fff;font-weight:800;letter-spacing:.18em;font-size:.8rem;-webkit-user-select:none;user-select:none;touch-action:none}
.in-hold i{position:absolute;left:0;top:0;bottom:0;width:0;background:linear-gradient(90deg,rgba(255,40,70,.5),rgba(255,90,110,.8));box-shadow:0 0 20px #FF2040}
.in-hold span{position:relative}
@media (prefers-reduced-motion:reduce){.in-vig,.in-scan,.in-box,.in-t::before,.in-t::after{animation:none!important}}
